# SwapSha backend, public testnet4 (Blueprint Phase 1 exit, step B7).
#
# Talks to the two Knots nodes from ~/Claude/swapsha/testnet4/swapsha_testnet4.sh:
#   SHA256 -> "sha"  127.0.0.1:48332  (SHA-256 testnet4)
#   BTC    -> "blake" 127.0.0.1:48432  (BLAKE2b testnet4, fork at 150,308)
# Both use the "swapsha" wallet. Its coins must be unique to their chain, or
# the backend refuses to start (D26).
#
# Ports, database and data dir are all separate from regtest, so both stacks
# can exist side by side (run one backend at a time to keep the Mac usable).
#
# Chain swaps only. No Lightning, no EVM, no Liquid.

network = "testnet"
loglevel = "debug"

[api]
host = "127.0.0.1"
port = 9_101

[grpc]
host = "127.0.0.1"
port = 9_100

[postgres]
host = "127.0.0.1"
port = 5432
database = "boltz_testnet4"
username = "boltz"
password = "boltz"

# BTC/SHA256: send Spamcoin (SHA-256, internal symbol SHA256), receive BTC
# (BLAKE2b), or the reverse. Names per Blueprint D27: BTC is the BLAKE2b
# chain; the SHA-256 chain is Spamcoin, with no ticker.
# rate is operator-set (D19). 1 here only because both sides are test coins.
[[pairs]]
base = "BTC"
quote = "SHA256"
rate = 1
fee = 0.5
maxSwapAmount = 10_000_000
minSwapAmount = 50_000
# Phase 2 (D28): type 1 = submarine (SHA256 on chain -> BTC Lightning),
# type 2 = reverse (BTC Lightning -> SHA256 on chain)
swapTypes = ["chain", "submarine", "reverse"]

[pairs.chainSwap]
minSwapAmount = 50_000

# Minutes. Both chains target 10 minute blocks. Test-only: short timeouts
# (12 blocks) so the refund tests finish in hours, not days. Mainnet values
# are set in Phase 3 with the operator.
#
# L5 (locked Nov 5): with the testnet4 pace bounds below, timeouts are
# stretched for the worst pairing (D30), so two values are raised:
#   reverse 360: Spamcoin lockup 36 blocks, hold invoice about 43 BTC blocks.
#     At 120 it would be 15, under the 18 that lnd accepts for an invoice.
#   swapTaproot 1100: type 1's BTC Lightning leg, 110 blocks. The Spamcoin
#     timeout becomes about 1,060 blocks, which leaves a CLTV limit of about
#     89 BTC blocks for SwapSha's payment: enough for an invoice with the
#     default 80-block final CLTV. At 720 the limit would be about 52.
[pairs.timeoutDelta]
chain = 120
reverse = 360
swapMinimal = 120
swapMaximal = 240
swapTaproot = 1100

[[currencies]]
symbol = "SHA256"
network = "bitcoinTestnet"
# D30: measured testnet4 pace (SwapSha_Phase2_Scope.md section 8, fastest and
# slowest 144-block windows). Lightning swaps pause while the tip is older
# than 2 hours (stale 0.1% of the last 30 days).
pace = { fastMinutesPerBlock = 6.17, slowMinutesPerBlock = 18.92, maxTipAgeMinutes = 120 }
preferredWallet = "core"
minWalletBalance = 0
maxSwapAmount = 10_000_000
minSwapAmount = 10_000
maxZeroConfAmount = 0

[currencies.chain]
host = "127.0.0.1"
port = 48_332
user = "swapsha"
password = "swapsha"
wallet = "swapsha"
feeFloor = 1

[[currencies]]
symbol = "BTC"
network = "bitcoinTestnet"
# D30: measured testnet4 pace, as above (stale 0.7% of the last 30 days at 2 hours)
pace = { fastMinutesPerBlock = 20.26, slowMinutesPerBlock = 59.44, maxTipAgeMinutes = 120 }
# BLAKE2b chain: SIGHASH_UNIFIED signing and fail-closed chain identity check
blake2b = true
preferredWallet = "core"
minWalletBalance = 0
maxSwapAmount = 10_000_000
minSwapAmount = 10_000
maxZeroConfAmount = 0

[currencies.chain]
host = "127.0.0.1"
port = 48_432
user = "swapsha"
password = "swapsha"
wallet = "swapsha"
feeFloor = 1

# Phase 2 (L5): the provider's Lightning Fork node from
# ../lightning/swapsha_ln_testnet4.sh, with the narrow SwapSha macaroon
# (./swapsha_ln_testnet4.sh macaroon). Startup refuses it unless it
# advertises option_blake2b and no simple taproot channels (D29, D32).
[[currencies.lnds]]
host = "127.0.0.1"
port = 10_021
# Node refuses an IP address as the TLS server name; the node's cert covers localhost
sslTargetNameOverride = "localhost"
certpath = "../lightning/testnet4-data/prov/tls.cert"
macaroonpath = "../lightning/testnet4-data/prov/swapsha.macaroon"

[swap]
# Claim right away instead of batching, so test runs finish sooner
deferredClaimSymbols = []
batchClaimInterval = "*/15 * * * *"
expiryTolerance = 120
cltvDelta = 20

[routing]
default = 0.0035

[rates]
interval = 1

[sidecar]

[sidecar.grpc]
host = "127.0.0.1"
port = 9103

[sidecar.ws]
host = "127.0.0.1"
port = 9104

[sidecar.api]
host = "127.0.0.1"
port = 9105
