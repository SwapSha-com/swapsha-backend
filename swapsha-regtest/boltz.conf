# SwapSha backend, local regtest (Blueprint Phase 1, step B4).
#
# Talks to the two Knots nodes from swapsha_regtest.sh:
#   BTC  -> "sha"   127.0.0.1:18443  (SHA-256 chain, never schedules the fork)
#   XBT  -> "blake" 127.0.0.1:18543  (BLAKE2b chain, fork at height 200)
# Both use the "swapsha" wallet, funded only with post-fork coinbases
# (`swapsha_regtest.sh provider`).
#
# Chain swaps only. No Lightning, no EVM, no Liquid.

network = "regtest"
loglevel = "debug"

[api]
host = "127.0.0.1"
port = 9_001

[grpc]
host = "127.0.0.1"
port = 9_000

[postgres]
host = "127.0.0.1"
port = 5432
database = "boltz"
username = "boltz"
password = "boltz"

# XBT/BTC: send BTC (SHA-256), receive XBT (BLAKE2b), or the reverse.
# rate is operator-set (D19). 1 here only because both sides are regtest coins.
[[pairs]]
base = "XBT"
quote = "BTC"
rate = 1
fee = 0.5
maxSwapAmount = 10_000_000
minSwapAmount = 50_000
swapTypes = ["chain"]

[pairs.chainSwap]
minSwapAmount = 50_000

# Minutes. Both chains target 10 minute blocks.
[pairs.timeoutDelta]
chain = 1440
reverse = 1440
swapMinimal = 1440
swapMaximal = 2880
swapTaproot = 10080

[[currencies]]
symbol = "BTC"
network = "bitcoinRegtest"
preferredWallet = "core"
minWalletBalance = 0
maxSwapAmount = 10_000_000
minSwapAmount = 10_000
maxZeroConfAmount = 0

[currencies.chain]
host = "127.0.0.1"
port = 18_443
user = "swapsha"
password = "swapsha"
wallet = "swapsha"
feeFloor = 1

[[currencies]]
symbol = "XBT"
network = "bitcoinRegtest"
# BLAKE2b chain: SIGHASH_UNIFIED signing and fail-closed chain identity check
blake2b = true
preferredWallet = "core"
minWalletBalance = 0
maxSwapAmount = 10_000_000
minSwapAmount = 10_000
maxZeroConfAmount = 0

[currencies.chain]
host = "127.0.0.1"
port = 18_543
user = "swapsha"
password = "swapsha"
wallet = "swapsha"
feeFloor = 1

[swap]
# Claim right away instead of batching, so regtest runs finish quickly
deferredClaimSymbols = []
batchClaimInterval = "*/15 * * * *"
expiryTolerance = 120
cltvDelta = 20

[routing]
default = 0.0035

[rates]
interval = 1

[sidecar]

[sidecar.grpc]
host = "127.0.0.1"
port = 9003

[sidecar.ws]
host = "127.0.0.1"
port = 9004

[sidecar.api]
host = "127.0.0.1"
port = 9005
