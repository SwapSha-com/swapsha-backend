# SwapSha backend, local regtest (Blueprint Phase 1, step B4).
#
# Talks to the two Knots nodes from swapsha_regtest.sh:
#   SHA256 -> "sha"  127.0.0.1:18443  (SHA-256 chain, never schedules the fork)
#   BTC    -> "blake" 127.0.0.1:18543  (BLAKE2b chain, fork at height 200)
# Both use the "swapsha" wallet, funded only with post-fork coinbases
# (`swapsha_regtest.sh provider`).
#
# Chain swaps only. No Lightning, no EVM, no Liquid.

network = "regtest"
loglevel = "debug"

[api]
host = "127.0.0.1"
port = 9_001

[grpc]
host = "127.0.0.1"
port = 9_000

[postgres]
host = "127.0.0.1"
port = 5432
database = "boltz"
username = "boltz"
password = "boltz"

# BTC/SHA256: send Spamcoin (SHA-256, internal symbol SHA256), receive BTC
# (BLAKE2b), or the reverse. Names per Blueprint D27: BTC is the BLAKE2b
# chain; the SHA-256 chain is Spamcoin, with no ticker.
# rate is operator-set (D19). 1 here only because both sides are regtest coins.
[[pairs]]
base = "BTC"
quote = "SHA256"
rate = 1
fee = 0.5
maxSwapAmount = 10_000_000
minSwapAmount = 50_000
swapTypes = ["chain"]

[pairs.chainSwap]
minSwapAmount = 50_000

# Minutes. Both chains target 10 minute blocks.
[pairs.timeoutDelta]
chain = 1440
reverse = 1440
swapMinimal = 1440
swapMaximal = 2880
swapTaproot = 10080

[[currencies]]
symbol = "SHA256"
network = "bitcoinRegtest"
preferredWallet = "core"
minWalletBalance = 0
maxSwapAmount = 10_000_000
minSwapAmount = 10_000
maxZeroConfAmount = 0

[currencies.chain]
host = "127.0.0.1"
port = 18_443
user = "swapsha"
password = "swapsha"
wallet = "swapsha"
feeFloor = 1

[[currencies]]
symbol = "BTC"
network = "bitcoinRegtest"
# BLAKE2b chain: SIGHASH_UNIFIED signing and fail-closed chain identity check
blake2b = true
preferredWallet = "core"
minWalletBalance = 0
maxSwapAmount = 10_000_000
minSwapAmount = 10_000
maxZeroConfAmount = 0

[currencies.chain]
host = "127.0.0.1"
port = 18_543
user = "swapsha"
password = "swapsha"
wallet = "swapsha"
feeFloor = 1

# Phase 2 (D23 amended, D31, D33): the provider's Lightning Fork node from
# ../lightning/swapsha_ln_regtest.sh, with the narrow SwapSha macaroon
# (./swapsha_ln_regtest.sh macaroon). Startup refuses it unless it advertises
# option_blake2b and no simple taproot channels (D29, D32).
[[currencies.lnds]]
host = "127.0.0.1"
port = 10_011
# Node refuses an IP address as the TLS server name; the node's cert covers localhost
sslTargetNameOverride = "localhost"
certpath = "../lightning/regtest-data/prov/tls.cert"
macaroonpath = "../lightning/regtest-data/prov/swapsha.macaroon"

[swap]
# Claim right away instead of batching, so regtest runs finish quickly
deferredClaimSymbols = []
batchClaimInterval = "*/15 * * * *"
expiryTolerance = 120
cltvDelta = 20

[routing]
default = 0.0035

[rates]
interval = 1

[sidecar]

[sidecar.grpc]
host = "127.0.0.1"
port = 9003

[sidecar.ws]
host = "127.0.0.1"
port = 9004

[sidecar.api]
host = "127.0.0.1"
port = 9005
